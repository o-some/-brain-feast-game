name: Boss-Modus jetzt installieren

on: push

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boss-Modus einbauen
        run: python apply_boss.py
      - name: JavaScript prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          Path('check.js').write_text(re.search(r'<script>\s*(.*?)\s*</script>', html, re.S).group(1))
          PY
          node --check check.js
          rm check.js
      - name: Auf main veröffentlichen
        run: |
          rm apply_boss.py .github/workflows/apply-boss.yml .github/workflows/apply-boss-now.yml
          git config user.name "Brain Feast Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add recurring boss battles"
          git push
