name: Fix initialization order

on:
  push:
    paths:
      - fix_init_order.py
      - .github/workflows/fix-init-order.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix runtime initialization order
        run: python fix_init_order.py
      - name: Validate runtime order and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          script_match = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          if not script_match:
              raise SystemExit('JavaScript block missing')
          script = script_match.group(1)
          early = script.find('joyPointer=null,joyUp=false')
          first_resize = script.find('resize();')
          late_decl = script.find('let joyPointer=null,joyUp=false')
          if early < 0 or first_resize < 0 or early > first_resize:
              raise SystemExit('Joystick state is still initialized after the first resize')
          if late_decl >= 0:
              raise SystemExit('Late joystick declaration still present')
          required = ["dataset.brainFeastReady='1'", 'tapAction(playBtn', 'id="play"', 'id="startFullscreenBtn"']
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Missing features: ' + ', '.join(missing))
          Path('check.js').write_text(script)
          PY
          node --check check.js
      - name: Publish and clean helpers
        run: |
          rm -f fix_init_order.py check.js .github/workflows/fix-init-order.yml
          git config user.name "Brain Feast Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix mobile startup runtime crash"
          git push
