name: Add landscape fullscreen controls

on:
  push:
    paths:
      - add_landscape_fullscreen.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Querformat Fullscreen und Steuerung einbauen
        run: python add_landscape_fullscreen.py
      - name: Fertige Version prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          required = [
            'id="stage"','id="rotateNotice"','id="fullscreenBtn"',
            'requestImmersive','screen.orientation.lock','orientationBlocked',
            'width:min(100vw,calc(100vh * 16 / 9))',
            '<div class="actions"><button class="action-btn" id="jumpBtn"',
            '<div class="joystick" id="joystick"',
            'weaponInventory','selectWeapon','Blitzschildkröte',
            'shots.length>=limit','particles.length>36'
          ]
          missing = [value for value in required if value not in html]
          if missing:
              raise SystemExit('Fehlende Bestandteile: ' + ', '.join(missing))
          match = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          if not match:
              raise SystemExit('JavaScript-Block fehlt')
          Path('check.js').write_text(match.group(1))
          PY
          node --check check.js
      - name: Veröffentlichen und aufräumen
        run: |
          rm -f add_landscape_fullscreen.py check.js .github/workflows/landscape-fullscreen.yml
          git config user.name "Brain Feast Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add 16 by 9 landscape fullscreen mobile controls"
          git push
