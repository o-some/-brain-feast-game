name: Add turtle skins and pause menu

on:
  push:
    paths:
      - add_turtle_skins_pause.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Schildkröten, Fähigkeiten und Pause einbauen
        run: python add_turtle_skins_pause.py
      - name: Gesamte Spielversion prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          required = [
              'Blitzschildkröte', 'Wasserschildkröte', 'Luftschildkröte', 'Erdschildkröte',
              'togglePause', 'KeyP', 'pauseBtn', 'resumeBtn', 'skinDefs',
              'Himmelszorn', 'Schädelwerfer', 'Volt-Säge', 'p.ammo=50',
              "type:'storm'", "type:'skull'", "type:'saw'",
              'lowPower', 'particles.length>36', 'shots.length>=3'
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Fehlende Bestandteile: ' + ', '.join(missing))
          match = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          if not match:
              raise SystemExit('JavaScript-Block fehlt')
          Path('check.js').write_text(match.group(1))
          PY
          node --check check.js
      - name: Zusammengeführte Version veröffentlichen
        run: |
          rm -f add_turtle_skins_pause.py check.js .github/workflows/add-turtle-skins-pause.yml
          git config user.name "Brain Feast Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add pause menu and four elemental turtle skins"
          git push
