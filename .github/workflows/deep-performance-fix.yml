name: Deep mobile shooting performance fix

on:
  push:
    paths:
      - apply_deep_performance_fix.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deep performance fix
        run: python apply_deep_performance_fix.py
      - name: Validate game JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          required = ["shots.length>=3", "lowPower=matchMedia", "particles.length>36", "shotSoundAt=t+.5", "function drawShot(s){x.save();x.translate(s.x,s.y)"]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Missing performance changes: ' + ', '.join(missing))
          match = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          if not match:
              raise SystemExit('JavaScript block missing')
          Path('check.js').write_text(match.group(1))
          PY
          node --check check.js
      - name: Commit optimized game
        run: |
          rm -f apply_deep_performance_fix.py check.js .github/workflows/deep-performance-fix.yml
          git config user.name "Brain Feast Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix severe mobile lag during continuous fire"
          git push
