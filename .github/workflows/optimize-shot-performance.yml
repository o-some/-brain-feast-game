name: Optimize shot performance

on:
  push:
    paths:
      - optimize_shots.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize lightning shots
        run: python optimize_shots.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          script = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          if not script:
              raise SystemExit('JavaScript block missing')
          Path('check.js').write_text(script.group(1))
          required = ['shots.length>=5', 'q.trail.length>3', 'particles.length>90']
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Performance limits missing: ' + ', '.join(missing))
          PY
          node --check check.js
      - name: Commit optimized game
        run: |
          rm -f optimize_shots.py check.js .github/workflows/optimize-shot-performance.yml
          git config user.name "Brain Feast Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Optimize continuous lightning fire performance"
          git push
