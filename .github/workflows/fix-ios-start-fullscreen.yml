name: Fix iOS start and fullscreen

on:
  push:
    paths:
      - fix_ios_start_fullscreen.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair iOS landscape start screen
        run: python fix_ios_start_fullscreen.py
      - name: Validate repaired game
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          required = [
            'iOS landscape start/fullscreen repair',
            'id="startFullscreenBtn"', 'id="rotateStartBtn"',
            'start-actions', 'resetStartScroll', 'pendingLandscapeStart',
            "stage||document.documentElement", "navigationUI:'hide'",
            'Rechts: Joystick', 'Links: großer Feuerknopf',
            'weaponInventory', 'Blitzschildkröte'
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Missing repair features: ' + ', '.join(missing))
          match = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          if not match:
              raise SystemExit('JavaScript block missing')
          Path('check.js').write_text(match.group(1))
          PY
          node --check check.js
      - name: Publish and clean helper files
        run: |
          rm -f fix_ios_start_fullscreen.py check.js .github/workflows/fix-ios-start-fullscreen.yml
          git config user.name "Brain Feast Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix iOS landscape start button and fullscreen"
          git push
