name: Fix iOS start controls v2

on:
  push:
    paths:
      - fix_ios_start_v2.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install iOS start control fix
        run: python fix_ios_start_v2.py
      - name: Validate game and buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          required = [
            'iOS guaranteed start controls v2', '100dvh',
            'id="play"', 'id="startFullscreenBtn"', 'type="button"',
            'start-mini-help', 'tapAction', 'setTimeout(begin,0)',
            'Rechts steuern', 'weaponInventory', 'Blitzschildkröte'
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Missing: ' + ', '.join(missing))
          match = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          if not match:
              raise SystemExit('JavaScript block missing')
          Path('check.js').write_text(match.group(1))
          PY
          node --check check.js
      - name: Publish and clean helpers
        run: |
          rm -f fix_ios_start_v2.py check.js .github/workflows/fix-ios-start-v2.yml
          git config user.name "Brain Feast Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Make iOS landscape start buttons always tappable"
          git push
