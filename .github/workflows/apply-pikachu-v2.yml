name: Pikachu Elektro Version installieren

on:
  push:
    paths:
      - .github/workflows/apply-pikachu-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Elektro-Version zusammensetzen
        run: |
          cat pika_patch_1.b64 pika_patch_2.b64 pika_patch_3.b64 pika_patch_4.b64 | tr -d '\n\r ' | base64 -d > apply_pikachu_v2.py
          python apply_pikachu_v2.py

      - name: JavaScript und Inhalte prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          required = ['Pikachu', 'Donnerblitz', 'VOLT-TITAN', "function electricSound", "function drawPlayer", "function drawShot"]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Fehlende Inhalte: ' + ', '.join(missing))
          match = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          if not match:
              raise SystemExit('Kein JavaScript gefunden')
          Path('check.js').write_text(match.group(1))
          PY
          node --check check.js
          rm check.js

      - name: Auf main veröffentlichen
        run: |
          rm -f apply_pikachu_v2.py pika_patch_1.b64 pika_patch_2.b64 pika_patch_3.b64 pika_patch_4.b64
          rm -f final_pika_1.b64 final_pika_2.b64 final_pika_3a.b64 final_pika_3b.b64 final_pika_4.b64
          rm -f .github/workflows/apply-pikachu-v2.yml
          git config user.name "Brain Feast Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Pikachu electric combat update"
          git push
