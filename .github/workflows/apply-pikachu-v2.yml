name: Pikachu Elektro Version installieren

on:
  push:
    paths:
      - apply_pikachu_v2.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Pikachu Elektro Version einbauen
        run: python apply_pikachu_v2.py
      - name: JavaScript prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          script = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S).group(1)
          Path('check.js').write_text(script)
          PY
          node --check check.js
          rm check.js
      - name: Änderung veröffentlichen
        run: |
          rm apply_pikachu_v2.py .github/workflows/apply-pikachu-v2.yml
          git config user.name "Brain Feast Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Pikachu electric skin and effects"
          git push
