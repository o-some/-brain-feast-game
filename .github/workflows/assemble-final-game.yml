name: Assemble final Brain Feast game

on:
  push:
    paths:
      - assemble_final_game.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble tested HTML
        run: |
          cat final_parts/part1.txt final_parts/part2.txt final_parts/part3.txt final_parts/part4.txt final_parts/part5.txt final_parts/part6.txt | base64 --decode > index.html
      - name: Validate complete game
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          required = [
            'Blitzschildkröte','Wasserschildkröte','Luftschildkröte','Erdschildkröte',
            'Himmelszorn','Schädelwerfer','Volt-Säge','togglePause','KeyP','pauseBtn','resumeBtn',
            'lowPower','particles.length>36','shots.length>=3'
          ]
          missing = [value for value in required if value not in html]
          if missing:
              raise SystemExit('Missing final features: ' + ', '.join(missing))
          match = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          if not match:
              raise SystemExit('JavaScript block missing')
          Path('check.js').write_text(match.group(1))
          PY
          node --check check.js
      - name: Publish and clean repository
        run: |
          rm -rf final_parts assemble_final_game.txt check.js
          rm -f add_turtle_skins_pause.py
          rm -f .github/workflows/add-turtle-skins-pause.yml
          rm -f .github/workflows/assemble-final-game.yml
          git config user.name "Brain Feast Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Merge turtle skins pause weapons and performance"
          git push
