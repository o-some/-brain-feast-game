name: Add mobile joystick and weapon inventory

on:
  push:
    paths:
      - add_mobile_joystick_inventory.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mobile-Steuerung und Waffeninventar einbauen
        run: python add_mobile_joystick_inventory.py
      - name: Fertige Spielversion prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          required = [
            'id="joystick"','id="fireBtn"','id="jumpBtn"',
            'data-weapon="thunder"','data-weapon="storm"','data-weapon="skull"','data-weapon="saw"',
            'weaponInventory','selectWeapon','moveJoy','Digit4',
            'Himmelszorn','Schädelwerfer','Volt-Säge',
            'shots.length>=limit','particles.length>36','Blitzschildkröte'
          ]
          missing = [value for value in required if value not in html]
          if missing:
              raise SystemExit('Fehlende Bestandteile: ' + ', '.join(missing))
          match = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          if not match:
              raise SystemExit('JavaScript-Block fehlt')
          Path('check.js').write_text(match.group(1))
          PY
          node --check check.js
      - name: Veröffentlichen und Hilfsdateien entfernen
        run: |
          rm -f add_mobile_joystick_inventory.py check.js .github/workflows/mobile-joystick-inventory.yml
          git config user.name "Brain Feast Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add mobile joystick and selectable weapon inventory"
          git push
